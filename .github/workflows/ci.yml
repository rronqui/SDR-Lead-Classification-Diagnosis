name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/

      # O projeto não possui suíte de testes versionada (tests/ está no .gitignore
      # por decisão do projeto). Não criar testes de fachada; quando testes forem
      # adicionados ao versionamento, incluir aqui: pytest tests/ -v
